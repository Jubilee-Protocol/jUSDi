[package]
name = "jusdi-vault"
version = "0.1.0"
description = "Jubilee USD Index Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jusdi_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.17"
pyth-solana-receiver-sdk = "0.3.0"
blake3 = "=1.5.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
