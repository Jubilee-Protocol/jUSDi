[package]
name = "jusdi-vault"
version = "0.1.0"
description = "Jubilee USD Index Solana Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jusdi_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
anchor-spl = "0.29.0"
solana-program = "1.16.0"
pyth-sdk-solana = "0.8.0"
blake3 = "=1.5.0"
