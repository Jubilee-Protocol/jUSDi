[package]
name = "jubilee-yield-stream"
version = "0.1.0"
description = "Jubilee Yield Stream - Endowment-as-a-Service for Immortal Agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "jubilee_yield_stream"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.17"
blake3 = "=1.5.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
