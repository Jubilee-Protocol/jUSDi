name: Fee Collection Keeper

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to collect fees from'
        required: true
        default: 'base'
        type: choice
        options:
          - base
          - baseSepolia

jobs:
  collect-fees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Collect fees (Base Mainnet)
        if: github.event.inputs.network == 'base' || github.event_name == 'schedule'
        env:
          RPC_URL: https://mainnet.base.org
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          VAULT_ADDRESS: '0x0B03463259d5041004290822444c4183aE936050'
        run: node scripts/keeper/collect_fees.js

      - name: Collect fees (Base Sepolia)
        if: github.event.inputs.network == 'baseSepolia'
        env:
          RPC_URL: https://sepolia.base.org
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          VAULT_ADDRESS: '0xc698e233fbb9810ae0f22e154ee0912fa188c69c'
        run: node scripts/keeper/collect_fees.js

