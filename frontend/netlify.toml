# Netlify configuration for Next.js
# The @netlify/plugin-nextjs handles most config automatically

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Farcaster Frame/Mini App manifest access
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Next.js runtime plugin (required for SSR/SSG)
[[plugins]]
  package = "@netlify/plugin-nextjs"
